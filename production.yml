networks:
  gateway:
    external: true
  datahub:
    external: true


services:
  web:
    build: .
    container_name: tbia-web-prod-container
    image: tbia-web-prod-image
    expose:
      - 8001
    depends_on:
      - postgres-web
    volumes:
      - .:/code
      - ../tbia-volumes/static:/tbia-volumes/static
      - ../tbia-volumes/bucket:/tbia-volumes/bucket
      - ../tbia-volumes/media:/tbia-volumes/media
      - ../tbia-volumes/solr:/tbia-volumes/solr
      - ../tbia-volumes/aws-certs:/etc/aws-certs:ro
    command: "./scripts/wait-for-it.sh solr:8983 -t 5 -- ./scripts/docker-web-entry.sh"
    restart: always
    env_file:
      - .env
    environment:
      - AWS_CONFIG_FILE=/etc/aws-certs/aws_config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - gateway
      - datahub
  # 背景工作（下載產檔、敏感資料檔案、ARK 永久保存檔），與 web 共用 image 與程式碼
  # 部署更新程式碼後需一併重啟：docker compose -f production.yml restart worker
  worker:
    build: .
    container_name: tbia-worker-prod-container
    image: tbia-web-prod-image
    depends_on:
      - web
      - postgres-web
    volumes:
      - .:/code
      - ../tbia-volumes/bucket:/tbia-volumes/bucket
      - ../tbia-volumes/media:/tbia-volumes/media
      - ../tbia-volumes/solr:/tbia-volumes/solr
      - ../tbia-volumes/aws-certs:/etc/aws-certs:ro
    command: python manage.py run_worker   # 先解鎖上次中斷的工作，再啟動 qcluster
    restart: always
    stop_grace_period: 2m   # 給執行中的工作收尾；仍被中止的工作會在 worker 重啟時補跑
    env_file:
      - .env
    environment:
      - AWS_CONFIG_FILE=/etc/aws-certs/aws_config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - gateway
      - datahub
  postgres-web:
    image: postgres:16-alpine
    container_name: tbia-db-prod-container
    restart: always
    volumes:
      - ../tbia-volumes/pgdata:/var/lib/postgresql/data/pgdata
      - ../tbia-volumes/bucket:/tbia-volumes/bucket
      - ../tbia-volumes/datahub_bucket:/datahub_bucket
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - PGDATA=/var/lib/postgresql/data/pgdata
    networks:
      - gateway
      - datahub
  nginx-portal:
    image: nginx:1.26.0-alpine
    container_name: nginx-portal
    restart: always
    volumes:
      - ./scripts/nginx/portal.conf:/etc/nginx/conf.d/default.conf
      - ./scripts/nginx/nginx-entrypoint.sh:/nginx-entrypoint.sh
      - ../tbia-volumes/static:/tbia-volumes/static
      - ../tbia-volumes/media:/tbia-volumes/media
      - ../tbia-volumes/logs/nginx:/var/log/nginx
    entrypoint: ["/bin/sh", "/nginx-entrypoint.sh"]
    depends_on:
      - web
    networks:
      - gateway
    labels:
      - "traefik.enable=true"

      # 整站 per-IP 限流
      - "traefik.http.middlewares.ratelimit-all.ratelimit.average=80"
      - "traefik.http.middlewares.ratelimit-all.ratelimit.burst=160"
      - "traefik.http.middlewares.ratelimit-all.ratelimit.period=1s"
      # 全站並發總量天花板
      - "traefik.http.middlewares.inflight-all.inflightreq.amount=250"

      # 主 router(唯一一組)
      - "traefik.http.routers.nginx-portal.rule=Host(`${PORTAL_HOST}`)"
      - "traefik.http.routers.nginx-portal.entrypoints=websecure"
      - "traefik.http.routers.nginx-portal.tls.certresolver=myresolver"
      - "traefik.http.routers.nginx-portal.middlewares=ratelimit-all,inflight-all"
      # 明確定義 service(讓 api-limit router 找得到)
      - "traefik.http.services.nginx-portal.loadbalancer.server.port=80"

      # /api 更嚴格
      - "traefik.http.middlewares.ratelimit-api.ratelimit.average=30"
      - "traefik.http.middlewares.ratelimit-api.ratelimit.burst=60"
      - "traefik.http.middlewares.ratelimit-api.ratelimit.period=1s"
      - "traefik.http.routers.nginx-portal-api-limit.rule=Host(`${PORTAL_HOST}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.nginx-portal-api-limit.entrypoints=websecure"
      - "traefik.http.routers.nginx-portal-api-limit.tls.certresolver=myresolver"
      - "traefik.http.routers.nginx-portal-api-limit.middlewares=ratelimit-api,inflight-all"
      - "traefik.http.routers.nginx-portal-api-limit.service=nginx-portal"