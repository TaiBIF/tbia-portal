upstream web_instance {
    server web:8001;
}

server {
    listen 80;
    charset utf-8;
    server_name _;

    client_max_body_size 20M;

    # 共同規格 polygon 以 GET 帶入，網址可能很長（預設單行上限 8k，超過回 414）
    large_client_header_buffers 4 64k;

    location /static/ {
        alias /tbia-volumes/static/;
        expires 7d;
    }

    location /media/ {
        alias /tbia-volumes/media/;
        expires 7d;
    }

    location /healthcheck {
        access_log off;
        return 200 "ok";
    }

    location / {
                proxy_pass              http://web_instance;
                proxy_redirect          off;
                proxy_set_header        Host $http_host;
                proxy_set_header        X-Real-IP $remote_addr;
                proxy_set_header        X-Forwarded-Host $host;
                proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header        X-Forwarded-Proto $scheme;
                proxy_connect_timeout   120;
                proxy_read_timeout      120;
                proxy_buffering off; 
                # /commonsearch/occurrence 回 302 時 Location 會帶整段 polygon，header 需放得下
                proxy_buffer_size 64k;
                proxy_busy_buffers_size 64k;
                proxy_buffers 16 16k;
    }
}